<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Primeiro App</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: block;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 50px 20px;
    }
    h1 { color: #333; }
    p { color: #666; font-size: 18px; }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 16px;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Meu Aplicativo Web</h1>
  <p>Bem-vindo ao meu primeiro app para a Play Store!</p>
  <button onclick="alert('Funciona perfeitamente!')">Clique Aqui</button>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
