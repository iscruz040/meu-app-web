<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bico Perto</title>
  <style>
    :root { --primary: #6c5ce7; --secondary: #00b894; --bg: #f8f9fa; --card: #ffffff; --text: #2d3436; --border: #dfe6e9; --danger: #d63031; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 500px; margin: 0 auto; }
    .card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); }
    .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 8px; cursor: pointer; }
    .btn-flat { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-danger { background: var(--danger); }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header style="text-align:center; margin-bottom:16px;">
    <h1 style="color:var(--primary);">📍 Bico Perto</h1>
  </header>

  <!-- LOGIN -->
  <div id="screen-login" class="card">
    <h3>🔑 Entrar na Conta</h3>
    <div class="form-group" style="margin-top:10px;">
      <label>CPF ou E-mail</label>
      <input type="text" id="loginUser" class="form-control" placeholder="Digite seu CPF ou E-mail">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="loginPass" class="form-control" placeholder="••••••••">
    </div>
    <button class="btn" id="btnLogin">Entrar</button>
    <button class="btn btn-flat" id="btnGoRegister">Cadastre-se</button>
    <button class="btn btn-danger" id="btnReset" style="margin-top:15px; font-size:0.75rem;">⚠️ Destravar App (Resetar Dados)</button>
  </div>

  <!-- PAINEL SIMPLES -->
  <div id="screen-app" class="card hidden">
    <h3>Bem-vindo, <span id="userName">--</span>!</h3>
    <p style="margin-top:8px; font-size:0.9rem;">Você está logado no sistema.</p>
    <button class="btn btn-danger" id="btnLogout" style="margin-top:16px;">Sair</button>
  </div>

  <script>
    // CAPTURA DE ERROS PARA NÃO TRAVAR EM BRANCO
    window.onerror = function(msg, url, line) {
      alert("Erro detectado: " + msg + " (Linha: " + line + ")");
      return false;
    };

    function safeStorageGet(key) {
      try {
        return JSON.parse(localStorage.getItem(key)) || [];
      } catch (e) {
        console.error("Erro ao ler LocalStorage", e);
        return [];
      }
    }

    document.getElementById('btnLogin').addEventListener('click', function() {
      const userVal = document.getElementById('loginUser').value.trim();
      const passVal = document.getElementById('loginPass').value.trim();

      if (!userVal || !passVal) {
        alert("Por favor, preencha o usuário/CPF e a senha.");
        return;
      }

      const users = safeStorageGet('bp_users');
      const cleanInput = userVal.replace(/\D/g, '');

      // Se não houver usuários cadastrados no navegador
      if (users.length === 0) {
        alert("Nenhum usuário cadastrado neste navegador ainda! Clique em 'Cadastre-se'.");
        return;
      }

      const found = users.find(u => {
        const cleanCpf = u.cpf ? u.cpf.replace(/\D/g, '') : '';
        const matchCpf = cleanInput && cleanCpf === cleanInput;
        const matchEmail = u.email && u.email.toLowerCase() === userVal.toLowerCase();
        return (matchCpf || matchEmail) && u.pass === passVal;
      });

      if (found) {
        localStorage.setItem('bp_active', JSON.stringify(found));
        showApp(found);
      } else {
        alert("CPF/E-mail ou senha incorretos.");
      }
    });

    document.getElementById('btnReset').addEventListener('click', function() {
      localStorage.clear();
      alert("Cache limpo! Tente navegar novamente.");
      location.reload();
    });

    function showApp(user) {
      document.getElementById('screen-login').classList.add('hidden');
      document.getElementById('screen-app').classList.remove('hidden');
      document.getElementById('userName').innerText = user.name || 'Usuário';
    }

    // VERIFICA LOGIN AO CARREGAR
    (function checkSession() {
      try {
        const active = JSON.parse(localStorage.getItem('bp_active'));
        if (active) showApp(active);
      } catch(e) {}
    })();
  </script>
</body>
</html>
