<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bico Perto</title>
  <style>
    :root { --primary: #6c5ce7; --secondary: #00b894; --bg: #f8f9fa; --card: #ffffff; --text: #2d3436; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 500px; margin: 0 auto; }
    
    .card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #dfe6e9; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 8px; cursor: pointer; }
    .btn-sec { background: var(--secondary); }
    .btn-flat { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }

    /* Esconde elementos por padrão */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h2 style="color:var(--primary); text-align:center; margin-bottom:16px;">📍 Bico Perto</h2>

  <!-- TELA 1: LOGIN -->
  <div id="screen-login" class="card">
    <h3>🔑 Entrar na Conta</h3>
    <div class="form-group" style="margin-top:10px;">
      <label>E-mail ou Telefone</label>
      <input type="text" id="loginUser" class="form-control" placeholder="seuemail@exemplo.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="loginPass" class="form-control" placeholder="••••••••">
    </div>
    <button class="btn" onclick="execLogin()">Entrar</button>
    <button class="btn btn-flat" onclick="goToRegister()">Não tem conta? Cadastre-se</button>
  </div>

  <!-- TELA 2: CADASTRO -->
  <div id="screen-register" class="card hidden">
    <h3>📝 Criar Conta</h3>
    <div class="form-group" style="margin-top:10px;">
      <label>Tipo de Conta</label>
      <select id="regType" class="form-control">
        <option value="client">Cliente (Quero Contratar)</option>
        <option value="provider">Prestador (Quero Fazer Bicos)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Nome Completo</label>
      <input type="text" id="regName" class="form-control" placeholder="Ex: Maria Silva">
    </div>
    <div class="form-group">
      <label>Telefone / WhatsApp</label>
      <input type="text" id="regPhone" class="form-control" placeholder="(11) 99999-8888">
    </div>
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="regEmail" class="form-control" placeholder="maria@email.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="regPass" class="form-control" placeholder="••••••••">
    </div>
    <button class="btn btn-sec" onclick="execRegister()">Cadastrar e Enviar SMS</button>
    <button class="btn btn-flat" onclick="goToLogin()">Já tem conta? Fazer Login</button>
  </div>

  <!-- TELA 3: CONFIRMAÇÃO SMS -->
  <div id="screen-sms" class="card hidden">
    <h3>📱 Validação por SMS</h3>
    <div id="smsCodeBox" style="background:#fff3cd; padding:10px; border-radius:6px; margin:10px 0; color:#856404; font-weight:bold; text-align:center;"></div>
    <div class="form-group">
      <label>Digite o código de 4 dígitos:</label>
      <input type="number" id="smsInput" class="form-control" placeholder="1234">
    </div>
    <button class="btn btn-sec" onclick="confirmSMS()">Confirmar Código</button>
  </div>

  <!-- TELA 4: ÁREA LOGADA -->
  <div id="screen-app" class="card hidden">
    <h3 id="appWelcome">Bem-vindo!</h3>
    <p id="appUserType" style="color:gray; font-size:0.85rem; margin-bottom:12px;"></p>
    <button class="btn btn-flat" style="border-color:#d63031; color:#d63031;" onclick="execLogout()">🚪 Sair da Conta</button>
  </div>

  <script>
    let users = JSON.parse(localStorage.getItem('bp_users')) || [];
    let activeUser = JSON.parse(localStorage.getItem('bp_active_user')) || null;
    let pendingUser = null;
    let generatedPin = null;

    // NAVEGAÇÃO ENTRE TELAS
    function goToRegister() {
      document.getElementById('screen-login').classList.add('hidden');
      document.getElementById('screen-register').classList.remove('hidden');
    }

    function goToLogin() {
      document.getElementById('screen-register').classList.add('hidden');
      document.getElementById('screen-sms').classList.add('hidden');
      document.getElementById('screen-login').classList.remove('hidden');
    }

    // CADASTRO E SMS
    function execRegister() {
      const name = document.getElementById('regName').value;
      const phone = document.getElementById('regPhone').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPass').value;
      const type = document.getElementById('regType').value;

      if (!name || !phone || !pass) {
        alert("Preencha Nome, Telefone e Senha!");
        return;
      }

      generatedPin = Math.floor(1000 + Math.random() * 9000);
      pendingUser = { id: Date.now(), name, phone, email, pass, type };

      document.getElementById('screen-register').classList.add('hidden');
      document.getElementById('screen-sms').classList.remove('hidden');
      document.getElementById('smsCodeBox').innerText = "📲 SMS Recebido: Seu código de ativação é " + generatedPin;
    }

    function confirmSMS() {
      const inputPin = document.getElementById('smsInput').value;
      if (inputPin == generatedPin) {
        users.push(pendingUser);
        localStorage.setItem('bp_users', JSON.stringify(users));
        
        activeUser = pendingUser;
        localStorage.setItem('bp_active_user', JSON.stringify(activeUser));
        
        alert("✅ Conta criada e verificada!");
        checkAuth();
      } else {
        alert("❌ Código incorreto!");
      }
    }

    // LOGIN E LOGOUT
    function execLogin() {
      const login = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;

      const found = users.find(u => (u.email === login || u.phone === login) && u.pass === pass);
      if (found) {
        activeUser = found;
        localStorage.setItem('bp_active_user', JSON.stringify(activeUser));
        checkAuth();
      } else {
        alert("Usuário ou senha inválidos! (Se não cadastrou ainda, clique em Cadastre-se)");
      }
    }

    function execLogout() {
      activeUser = null;
      localStorage.removeItem('bp_active_user');
      checkAuth();
    }

    // VERIFICA SE JÁ ESTÁ LOGADO AO ABRIR
    function checkAuth() {
      document.getElementById('screen-login').classList.add('hidden');
      document.getElementById('screen-register').classList.add('hidden');
      document.getElementById('screen-sms').classList.add('hidden');
      document.getElementById('screen-app').classList.add('hidden');

      if (activeUser) {
        document.getElementById('screen-app').classList.remove('hidden');
        document.getElementById('appWelcome').innerText = "Olá, " + activeUser.name + "!";
        document.getElementById('appUserType').innerText = activeUser.type === 'client' ? 'Perfil: Cliente' : 'Perfil: Prestador de Serviço';
      } else {
        document.getElementById('screen-login').classList.remove('hidden');
      }
    }

    // Inicializa
    checkAuth();
  </script>
</body>
</html>
